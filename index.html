document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"cd514421-82ac-4daf-9aa1-92afda63a43c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   COLORS\n   A warm-on-dark palette. The surface is GitHub-dark\n   (#0d1117), but every text token is warm off-white — the\n   product feels clinical yet gentle. Four \"pillar\" hues\n   (Body / Mind / Soul / Finance) carry all the meaning.\n   ============================================================ */\n\n:root {\n  /* ---- Raw surface scale (dark, cool, near-black) ---- */\n  --bg-0: #0d1117;   /* app canvas */\n  --bg-1: #161b22;   /* raised: sticky header, popovers */\n  --bg-2: #1e2535;   /* floating: tooltips, menus */\n\n  /* Translucent surfaces painted over the canvas.\n     These are how cards & rows are built — never a solid fill. */\n  --surface-card:      rgba(255, 255, 255, 0.025);\n  --surface-raised:    rgba(255, 255, 255, 0.03);\n  --surface-track:     rgba(255, 255, 255, 0.07);  /* progress-bar troughs */\n  --surface-done:      rgba(255, 255, 255, 0.015); /* completed / dimmed rows */\n\n  /* ---- Borders (hairline white at low alpha) ---- */\n  --border:        rgba(255, 255, 255, 0.08);  /* default card / row edge */\n  --border-soft:   rgba(255, 255, 255, 0.06);  /* section dividers */\n  --border-faint:  rgba(255, 255, 255, 0.05);  /* completed-row edge */\n\n  /* ---- Text (warm, never pure white) ---- */\n  --text-heading:  #f0ece4;  /* titles, completed challenge text */\n  --text-primary:  #e6e1d8;  /* default body copy */\n  --text-muted:    #6b7280;  /* meta, captions, secondary */\n\n  /* ============================================================\n     PILLAR HUES — the semantic heart of the brand.\n     Each life-pillar owns one hue, used for its label, its\n     progress fill, its checkbox, and any tint it casts.\n     ============================================================ */\n  --body:      #4ade80;  /* Body    — green  */\n  --mind:      #60a5fa;  /* Mind    — blue   */\n  --soul:      #e879f9;  /* Soul    — magenta*/\n  --finance:   #fbbf24;  /* Finance — gold   */\n\n  /* ---- Functional accents ---- */\n  --challenge: #fb923c;  /* daily-challenge orange */\n  --danger:    #f87171;  /* hard-truth / warnings  */\n\n  /* ---- Extended accents (used in \"why it works\" lists) ---- */\n  --cyan:      #22d3ee;\n  --violet:    #a78bfa;\n\n  /* ---- Progress gradient stops (threshold-driven) ---- */\n  --grad-good-a:  #4ade80;  --grad-good-b:  #22c55e;  /* >=70% */\n  --grad-mid-a:   #fbbf24;  --grad-mid-b:   #f59e0b;  /* 40-69% */\n  --grad-low-a:   #f87171;  --grad-low-b:   #ef4444;  /* <40%  */\n\n  /* ============================================================\n     TINTS — every accent also exists as a faint wash + a\n     soft border, the recipe behind challenge / scripture /\n     warning callout cards.\n     ============================================================ */\n  --tint-challenge-bg:     rgba(251, 146, 60, 0.10);\n  --tint-challenge-bg-2:   rgba(251, 146, 60, 0.04);\n  --tint-challenge-border: rgba(251, 146, 60, 0.35);\n  --tint-challenge-soft:   rgba(251, 146, 60, 0.10);\n\n  --tint-soul-bg:      rgba(232, 121, 249, 0.05);\n  --tint-soul-border:  rgba(232, 121, 249, 0.18);\n\n  --tint-danger-bg:     rgba(239, 68, 68, 0.07);\n  --tint-danger-border: rgba(239, 68, 68, 0.22);\n\n  --tint-finance-bg:     rgba(251, 191, 36, 0.03);\n  --tint-finance-border: rgba(251, 191, 36, 0.20);\n\n  --tint-mind-bg:      rgba(96, 165, 250, 0.12);\n  --tint-mind-border:  rgba(96, 165, 250, 0.40);\n\n  --tint-body-bg:      rgba(74, 222, 128, 0.07);\n  --tint-body-border:  rgba(74, 222, 128, 0.30);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   TYPOGRAPHY\n   Two voices, deliberately opposed:\n   • A warm SERIF (Georgia) for everything a human reads —\n     tasks, encouragement, scripture. It feels personal,\n     literary, un-corporate.\n   • A clinical MONO for every label, metric, badge and\n     number. Uppercase + wide tracking. It reads like a\n     medical chart.\n\n   Georgia is a system serif (web-safe). For guaranteed\n   cross-platform rendering, HTML specimens load Gelasio\n   (a metric-compatible Georgia) + JetBrains Mono from\n   Google Fonts; the stacks below fall back to system fonts.\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  --font-serif: Georgia, \"Gelasio\", \"Times New Roman\", serif;\n  --font-mono:  \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, Monaco, \"Cascadia Code\", monospace;\n\n  /* ---- Sizes (px — the product is mobile, scales are small & tight) ---- */\n  --fs-2xs:   9px;   /* micro day-badges */\n  --fs-xs:   10px;   /* mono labels, captions */\n  --fs-sm:   11px;   /* tab labels, scores, points */\n  --fs-md:   12px;   /* secondary body, hints */\n  --fs-base: 13px;   /* default body / task copy */\n  --fs-lg:   13.5px; /* challenge & weekly copy */\n  --fs-xl:   16px;   /* large emphasis */\n  --fs-title:20px;   /* screen / card titles */\n  --fs-display: 30px;/* the hero percentage */\n\n  /* ---- Weights ---- */\n  --fw-regular: 400;  /* @kind font */\n  --fw-medium:  500;  /* @kind font */\n  --fw-semibold:600;  /* @kind font */\n\n  /* ---- Line heights ---- */\n  --lh-tight:  1.4;   /* @kind font */\n  --lh-snug:   1.5;   /* @kind font */\n  --lh-relaxed:1.65;  /* @kind font */\n  --lh-loose:  1.7;   /* @kind font */\n\n  /* ---- Tracking (mono labels live wide) ---- */\n  --tracking-tight:  0.08em;\n  --tracking-label:  0.12em;\n  --tracking-wide:   0.15em;\n  --tracking-widest: 0.18em;\n\n  /* ---- Semantic roles ---- */\n  --type-display:    var(--fw-medium) var(--fs-display)/1 var(--font-mono);\n  --type-title:      var(--fw-semibold) var(--fs-title)/1.2 var(--font-serif);\n  --type-body:       var(--fw-regular) var(--fs-base)/var(--lh-snug) var(--font-serif);\n  --type-label:      var(--fw-regular) var(--fs-xs)/1 var(--font-mono);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   SPACING & LAYOUT\n   The app lives in a single 520px column with a 20px gutter.\n   Spacing is small and rhythmic; nothing is airy.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale ---- */\n  --sp-1:  2px;\n  --sp-2:  4px;\n  --sp-3:  6px;\n  --sp-4:  8px;\n  --sp-5:  10px;\n  --sp-6:  12px;\n  --sp-7:  14px;\n  --sp-8:  16px;\n  --sp-9:  18px;\n  --sp-10: 20px;\n  --sp-11: 22px;\n\n  /* ---- Layout ---- */\n  --content-max: 520px;   /* the single reading column */\n  --gutter:      20px;    /* horizontal page padding */\n  --header-pad:  18px;\n\n  /* ---- Component padding presets ---- */\n  --pad-row:   11px 13px;  /* task / checklist rows */\n  --pad-card:  16px 18px;  /* tinted callout cards */\n  --pad-card-lg: 18px;     /* info cards */\n  --pad-pillar: 10px 12px; /* compact pillar cards */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   EFFECTS — radii, borders, shadows, blur, motion\n   Soft rounded rectangles, hairline borders, almost no\n   shadow (the dark surface does the lifting). The one real\n   shadow belongs to floating tooltips.\n   ============================================================ */\n\n:root {\n  /* ---- Radii ---- */\n  --r-xs:   3px;   /* progress fills */\n  --r-sm:   5px;   /* checkboxes */\n  --r-md:   8px;   /* buttons, tabs */\n  --r-lg:  10px;   /* rows, pillar cards */\n  --r-xl:  12px;   /* info cards */\n  --r-2xl: 14px;   /* hero / challenge card */\n  --r-pill: 20px;  /* badges, day chips */\n\n  /* ---- Border widths ---- */\n  --bw-hair: 1px;\n  --bw-chk:  2px;  /* checkbox stroke */\n\n  /* ---- Bar heights ---- */\n  --bar-track:    5px;  /* header progress */\n  --bar-track-sm: 4px;  /* pillar progress */\n  --bar-track-xs: 3px;\n\n  /* ---- Shadows ---- */\n  --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.6);   /* tooltips, popovers */\n  --shadow-card: 0 1px 0 rgba(255, 255, 255, 0.02) inset;\n\n  /* ---- Blur ---- */\n  --blur-header: blur(12px);  /* @kind other */\n\n  /* ---- Motion ---- */\n  --ease: cubic-bezier(0.4, 0, 0.2, 1);  /* @kind other */\n  --dur-fast:  0.2s;   /* @kind other */\n  --dur-base:  0.4s;   /* @kind other */\n  --dur-slow:  0.5s;   /* @kind other */\n}\n<\u002Fstyle>\n<script src=\"7b2a8359-2344-4705-8cd3-ef2dbfc2b75a\"><\u002Fscript>\n<script type=\"module\" src=\"52eaf15d-445e-45e8-8d45-c009c1d71006\"><\u002Fscript>\n<style>\n*{box-sizing:border-box;}\nhtml,body{margin:0;padding:0;}\nbody{background:#04060a;font-family:var(--font-serif);-webkit-font-smoothing:antialiased;}\n.scr::-webkit-scrollbar{width:0;height:0;}\n.scr{scrollbar-width:none;}\ninput::placeholder{color:var(--text-muted);opacity:0.7;}\ninput,select,button,textarea{font-family:inherit;}\nselect{appearance:none;-webkit-appearance:none;}\n@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}\n@keyframes fadein{from{opacity:0;}to{opacity:1;}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;background:radial-gradient(120% 80% at 50% -10%, #11161f 0%, #04060a 60%);\">\n  <div style=\"position:relative;width:414px;height:868px;border-radius:56px;padding:13px;background:linear-gradient(160deg,#26272b,#0b0b0d 55%);box-shadow:0 50px 110px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.06), inset 0 0 0 7px #060608;\">\n    <div class=\"scr\" style=\"position:relative;width:100%;height:100%;background:var(--bg-0);border-radius:44px;overflow:hidden;display:flex;flex-direction:column;\">\n\n      <div style=\"height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:6;\">\n        <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--text-heading);letter-spacing:0.02em;\">{{ statusTime }}<\u002Fspan>\n        <div style=\"position:absolute;left:50%;top:0;transform:translateX(-50%);width:118px;height:26px;background:#000;border-radius:0 0 18px 18px;\"><\u002Fdiv>\n        <span style=\"font-family:var(--font-mono);font-size:11px;color:var(--text-heading);letter-spacing:2px;\">●●● ⏱ ▤<\u002Fspan>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:fadein 0.4s;\">\n          <div style=\"font-size:30px;\">✿<\u002Fdiv>\n          <div style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;color:var(--text-muted);text-transform:uppercase;\">Life Tracker<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 30px;gap:26px;animation:rise 0.5s var(--ease);\">\n          <div style=\"text-align:center;\">\n            <div style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.2em;color:var(--text-muted);text-transform:uppercase;\">Track what matters<\u002Fdiv>\n            <div style=\"font-family:var(--font-serif);font-size:34px;font-weight:600;color:var(--text-heading);margin-top:12px;line-height:1.1;\">Life Tracker<\u002Fdiv>\n            <div style=\"font-family:var(--font-serif);font-style:italic;font-size:13.5px;color:var(--text-muted);margin-top:12px;\">Mind · Body · Reflection · Finance<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;\">\n            <input value=\"{{ email }}\" oninput=\"{{ onEmail }}\" placeholder=\"email\" autocomplete=\"off\" style=\"width:100%;background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px;color:var(--text-primary);font-family:var(--font-serif);font-size:14px;outline:none;\">\n            <input value=\"{{ password }}\" oninput=\"{{ onPassword }}\" type=\"password\" placeholder=\"password\" style=\"width:100%;background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px;color:var(--text-primary);font-family:var(--font-serif);font-size:14px;outline:none;\">\n            <sc-if value=\"{{ authErr }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-family:var(--font-serif);font-size:12px;color:var(--danger);padding:2px 2px;line-height:1.4;\">{{ authErr }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"margin-top:4px;\">\n              <x-import component-from-global-scope=\"RecoveryTrackerDesignSystem_560edc.Button\" accent=\"mind\" variant=\"solid\" full-width=\"{{ true }}\" size=\"lg\" onclick=\"{{ submitAuth }}\" hint-size=\"100%,44px\">{{ authCta }}<\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"text-align:center;font-family:var(--font-mono);font-size:10px;letter-spacing:0.04em;color:var(--text-muted);margin-top:6px;\">{{ authSwitchText }} <span onclick=\"{{ toggleAuth }}\" style=\"color:var(--mind);cursor:pointer;\">{{ authSwitchCta }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center;font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.06em;color:var(--text-muted);border-top:1px solid var(--border-soft);padding-top:16px;\">Demo account — demo@lifetracker.app / lifetracker<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isOnboarding }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"scr\" style=\"flex:1;display:flex;flex-direction:column;padding:22px 24px 20px;overflow-y:auto;animation:rise 0.5s var(--ease);\">\n          <div style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;color:var(--text-muted);text-transform:uppercase;\">Welcome<\u002Fdiv>\n          <div style=\"font-family:var(--font-serif);font-size:24px;font-weight:600;color:var(--text-heading);margin-top:8px;line-height:1.2;\">What do you want to track?<\u002Fdiv>\n          <div style=\"font-family:var(--font-serif);font-size:13px;color:var(--text-muted);margin-top:8px;line-height:1.5;\">Pick what matters to you. You can change this anytime in Settings.<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:20px;\">\n            <sc-for list=\"{{ onbCards }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div onclick=\"{{ c.toggle }}\" style=\"{{ c.style }}\">\n                <span style=\"font-size:22px;line-height:1.1;color:{{ c.iconColor }};\">{{ c.icon }}<\u002Fspan>\n                <div style=\"flex:1;min-width:0;\">\n                  <div style=\"font-family:var(--font-serif);font-size:15px;color:var(--text-heading);\">{{ c.label }}<\u002Fdiv>\n                  <div style=\"font-family:var(--font-serif);font-size:12px;color:var(--text-muted);margin-top:2px;line-height:1.4;\">{{ c.desc }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"{{ c.check }}\">{{ c.mark }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-height:20px;\"><\u002Fdiv>\n          <div style=\"margin-top:18px;\">\n            <x-import component-from-global-scope=\"RecoveryTrackerDesignSystem_560edc.Button\" accent=\"mind\" variant=\"solid\" full-width=\"{{ true }}\" size=\"lg\" onclick=\"{{ completeOnboarding }}\" hint-size=\"100%,44px\">Start tracking<\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ false }}\">\n\n        <div style=\"flex-shrink:0;padding:12px 20px 13px;background:var(--bg-1);border-bottom:1px solid var(--border-soft);display:flex;align-items:flex-end;justify-content:space-between;gap:12px;\">\n          <div>\n            <div style=\"font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.16em;color:var(--text-muted);text-transform:uppercase;\">{{ headerKicker }}<\u002Fdiv>\n            <div style=\"font-family:var(--font-serif);font-size:21px;font-weight:600;color:var(--text-heading);margin-top:3px;line-height:1;\">{{ headerTitle }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:right;\">\n            <div style=\"font-family:var(--font-mono);font-size:17px;font-weight:500;color:{{ headerMetricColor }};line-height:1;\">{{ headerMetric }}<\u002Fdiv>\n            <div style=\"font-family:var(--font-mono);font-size:8.5px;letter-spacing:0.12em;color:var(--text-muted);text-transform:uppercase;margin-top:4px;\">{{ headerMetricLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"scr\" style=\"flex:1;overflow-y:auto;padding:16px 18px 24px;\">\n\n          <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:15px;animation:rise 0.4s var(--ease);\">\n              <div style=\"padding:18px;border-radius:var(--r-2xl);border:1px solid var(--tint-mind-border);background:linear-gradient(140deg, color-mix(in srgb, var(--mind) 9%, transparent), color-mix(in srgb, var(--mind) 2%, transparent));\">\n                <div style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.13em;color:var(--mind);text-transform:uppercase;\">{{ homeGreet }}<\u002Fdiv>\n                <div style=\"font-family:var(--font-serif);font-size:21px;font-weight:500;color:var(--text-heading);margin-top:8px;line-height:1.3;\">{{ homeEncourage }}<\u002Fdiv>\n                <div style=\"font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.08em;color:var(--text-muted);margin-top:10px;text-transform:uppercase;\">{{ homeDate }}<\u002Fdiv>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ hasTiles }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;\">\n                  <sc-for list=\"{{ homeTiles }}\" as=\"t\" hint-placeholder-count=\"4\">\n                    <div style=\"background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--r-lg);padding:10px 12px;\">\n                      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;\"><span style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:{{ t.color }};display:flex;gap:5px;align-items:center;\"><span style=\"font-size:12px;\">{{ t.icon }}<\u002Fspan>{{ t.label }}<\u002Fspan><span style=\"font-family:var(--font-mono);font-size:11px;color:var(--text-muted);\">{{ t.val }}<\u002Fspan><\u002Fdiv>\n                      <x-import component-from-global-scope=\"RecoveryTrackerDesignSystem_560edc.ProgressBar\" value=\"{{ t.bar }}\" accent=\"{{ t.accent }}\" height=\"{{ 4 }}\" hint-size=\"100%,4px\"><\u002Fx-import>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ showFinance }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-xl);padding:16px 18px;\">\n                  <x-import component-from-global-scope=\"RecoveryTrackerDesignSystem_560edc.SectionLabel\" accent=\"finance\" icon=\"💰\" divider=\"{{ true }}\" hint-size=\"100%,22px\">Net worth<\u002Fx-import>\n                  <div style=\"font-family:var(--font-mono);font-size:28px;font-weight:500;color:var(--text-heading);margin-top:12px;\">{{ nwTotal }}<\u002Fdiv>\n                  <div style=\"display:flex;height:8px;border-radius:var(--r-xs);overflow:hidden;background:var(--surface-track);margin:11px 0 9px;\"><div style=\"{{ liquidSeg }}\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);\">\n                    <span style=\"color:var(--body);\">● Liquid {{ nwLiquid }}<\u002Fspan>\n                    <span>Locked {{ nwLocked }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"border-top:1px solid var(--border-soft);margin-top:13px;padding-top:12px;display:flex;justify-content:space-between;align-items:baseline;\">\n                    <span style=\"font-family:var(--font-serif);font-size:13px;color:var(--text-primary);\">Financial freedom at age <span style=\"color:var(--finance);font-weight:600;\">{{ fireAge }}<\u002Fspan><\u002Fspan>\n                    <span style=\"font-family:var(--font-mono);font-size:10px;color:var(--text-muted);\">target {{ fireNum }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isMind }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:15px;animation:rise 0.4s var(--ease);\">\n              <div style=\"background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-xl);padding:16px;\">\n                <div style=\"font-family:var(--font-serif);font-size:15px;color:var(--text-heading);margin-bottom:13px;\">How is today landing?<\u002Fdiv>\n                <div style=\"display:flex;gap:6px;\">\n                  <sc-for list=\"{{ moods }}\" as=\"m\" hint-placeholder-count=\"5\">\n                    <div onclick=\"{{ m.pick }}\" style=\"{{ m.style }}\">\n                      < ows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                      <div style=\"{{ r.style }}\"><span style=\"width:48px;font-family:var(--font-mono);font-size:12px;color:var(--text-heading);\">{{ r.age }}<\u002Fspan><span style=\"flex:1;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);\">{{ r.year }}<\u002Fspan><span style=\"width:78px;text-align:right;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);\">{{ r.contribution }}<\u002Fspan><span style=\"width:84px;text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--text-primary);\">{{ r.end }}<\u002Fspan><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"font-family:var(--font-serif);font-style:italic;font-size:12px;color:var(--text-muted);text-align:center;line-height:1.5;padding:0 8px;\">Tune return, surplus and expenses in Settings to test scenarios. Recovery isn’t for perfection — it’s for direction.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:15px;animation:rise 0.4s var(--ease);\">\n              <div style=\"background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-xl);padding:8px 16px;\">\n                <div style=\"font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.14em;color:var(--text-muted);text-transform:uppercase;padding:12px 0 8px;\">Your trackers<\u002Fdiv>\n                <sc-for list=\"{{ trackerToggles }}\" as=\"t\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-soft);\">\n                    <span style=\"font-size:18px;line-height:1;\">{{ t.icon }}<\u002Fspan>\n                    <div style=\"flex:1;min-width:0; urface-card);border:1px solid var(--border);border-radius:var(--r-xl);padding:16px;\">\n                <div style=\"font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.14em;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px;\">Account<\u002Fdiv>\n                <div style=\"font-family:var(--font-serif);font-size:14px;color:var(--text-heading);\">{{ userEmail }}<\u002Fdiv>\n                <div style=\"margin-top:14px;\"><x-import component-from-global-scope=\"RecoveryTrackerDesignSystem_560edc.Button\" accent=\"danger\" variant=\"ghost\" full-width=\"{{ true }}\" onclick=\"{{ signOut }}\" hint-size=\"100%,40px\">Sign out<\u002Fx-import><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.06em;color:var(--text-muted);text-align:center;line-height:1.6;padding:0 10px;\">All data flows through the backend contract — portable to iOS &amp; Android via Capacitor.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n        <\u002Fdiv>\n\n        <div style=\"flex-shrink:0;display:flex;border-top:1px solid var(--border);background:var(--bg-1);padding:8px 6px 12px;\">\n          <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"5\">\n            <button onclick=\"{{ n.go }}\" style=\"{{ n.style }}\">\n              <span style=\"font-size:19px;line-height:1;\">{{ n.icon }}<\u002Fspan>\n              <span style=\"font-family:var(--font-mono);font-size:8px;letter-spacing:0.08em;text-transform:uppercase;margin-top:4px;\">{{ n.label }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ toastShow }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-pill);padding:9px 18px;font-family:var(--font-serif);font-size:12.5px;color:var(--text-heading);box-shadow:var(--shadow-pop);white-space:nowrap;z-index:10;animation:rise 0.3s var(--ease);\">{{ toast }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:468,&quot;height&quot;:924}}\">\nconst FACES = ['', '\\u{1F61E}', '\\u{1F61F}', '\\u{1F610}', '\\u{1F642}', '\\u{1F604}'];\nconst WORDS = ['', 'Low', 'Down', 'Okay', 'Good', 'Great'];\nconst TAGS = ['calm', 'grateful', 'hopeful', 'anxious', 'low', 'tired'];\n\nfunction money(n) { if (n == null || isNaN(n)) return '$0'; const v = Math.round(Math.abs(n)).toLocaleString('en-US'); return (n < 0 ? '-$' : '$') + v; }\nfunction moneyK(n) { if (n == null || isNaN(n)) return '$0'; const a = Math.abs(n); if (a >= 1000) return (n < 0 ? '-$' : '$') + (a / 1000).toFixed(a >= 10000 ? 0 : 1) + 'k'; return money(n); }\nfunction pct(n, d) { if (n == null || isNaN(n)) return '0%'; return n.toFixed(d || 0) + '%'; }\nfunction dshort(iso) { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); }\n\nclass Component extends DCLogic {\n  state = {\n    ready: false, user: null,\n    authMode: 'signin', email: 'demo@lifetracker.app', password: 'lifetracker', authErr: '', authBusy: false,\n    screen: 'home', moneyTab: 'cashflow',\n    profile: null, onbSel: ['mentalHealth', 'fitness', 'spirit', 'finance'],\n    spirit: [], spPractice: 'Meditation', spMinutes: '', spGratitude: '', spNote: '',\n    settings: null,\n    mh: [], fit: [], financeLog: [], financeBalance: 0,\n    month: new Date().toISOString().slice(0, 7),\n    cashItems: [], cashSummary: null,\n    debts: [], debtStats: null, debtSim: null, debtExtra: 500,\n    assetList: [], netWorth: null, vests: [], rsu: null,\n    projection: null,\n    moodVal: 4, moodNote: '', moodSleep: '', moodTags: [],\n    fitAct: 'Run', fitDur: 30, fitInt: 3, fitNote:
